<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brr Brr Deng Deng — 3D Three.js Model Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #090c10;
        color: #e6e9ef;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 320px;
        max-height: calc(100% - 32px);
        overflow-y: auto;
        padding: 18px;
        border-radius: 12px;
        background: rgba(13, 17, 23, 0.90);
        border: 1px solid rgba(230, 233, 239, 0.16);
        backdrop-filter: blur(12px);
        font-size: 12px;
        line-height: 1.6;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      #panel h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f7a048;
      }
      #panel .sub {
        margin: 0 0 14px;
        color: #8b949e;
        font-size: 11px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .row label {
        flex: 0 0 80px;
        color: #9aa3b2;
      }
      input[type='range'] {
        flex: 1 1 auto;
        min-width: 0;
        accent-color: #f7a048;
      }
      .value {
        flex: 0 0 44px;
        text-align: right;
        font-weight: 600;
        color: #f7a048;
      }
      select,
      button {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        border: 1px solid rgba(230, 233, 239, 0.18);
        background: rgba(247, 160, 72, 0.14);
        color: #e6e9ef;
        font: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      button:hover,
      select:hover {
        background: rgba(247, 160, 72, 0.28);
        border-color: rgba(247, 160, 72, 0.4);
      }
      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 8px;
      }
      .btn-grid button {
        margin-bottom: 0;
      }
      .toggle.on {
        background: rgba(120, 220, 160, 0.26);
        border-color: rgba(120, 220, 160, 0.5);
        color: #78dca0;
      }
      hr {
        border: 0;
        border-top: 1px solid rgba(230, 233, 239, 0.14);
        margin: 14px 0;
      }
      #stats {
        color: #8b949e;
        white-space: pre-line;
        font-size: 11px;
      }
      #badge {
        position: fixed;
        bottom: 16px;
        right: 16px;
        padding: 8px 14px;
        background: rgba(13, 17, 23, 0.85);
        border: 1px solid rgba(247, 160, 72, 0.3);
        border-radius: 8px;
        font-size: 11px;
        color: #c9d1d9;
        backdrop-filter: blur(8px);
      }
      #badge b {
        color: #f7a048;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="panel">
      <h1>BRR BRR DENG DENG</h1>
      <p class="sub">Three.js Procedural Low-Poly Character</p>

      <div class="row">
        <label for="speed">Yürüme Hızı</label>
        <input id="speed" type="range" min="0" max="6" step="0.05" value="0" />
        <span class="value" id="speed-value">0.00</span>
      </div>

      <div class="row">
        <label for="turn">Dönüş Hızı</label>
        <input id="turn" type="range" min="-2" max="2" step="0.05" value="0" />
        <span class="value" id="turn-value">0.00</span>
      </div>

      <div class="row">
        <label for="scale">Boyut</label>
        <select id="scale">
          <option value="player" selected>Player (1.88m)</option>
          <option value="minion">Minion (0.8m)</option>
          <option value="boss">Boss (3.75m)</option>
        </select>
      </div>

      <div class="btn-grid">
        <button id="grounded" class="toggle on" type="button">Yerde / Zıplama</button>
        <button id="wireframe" class="toggle" type="button">Wireframe</button>
      </div>

      <div class="btn-grid">
        <button id="die" type="button">Ölüm Animasyonu</button>
        <button id="respawn" type="button">Yeniden Doğur</button>
      </div>

      <button id="palette" type="button">Rastgele Renk Paleti</button>
      <button id="lightning" class="toggle" type="button">Fırtına / Şimşek Efekti</button>

      <hr />

      <div id="stats">Model yükleniyor...</div>
    </div>

    <div id="badge">
      <b>3D Asset Library</b> · Procedural Zero-GC
    </div>

    <script type="module" src="/demo/dengdeng.ts"></script>
  </body>
</html>
